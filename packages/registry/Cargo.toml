[package]
name = "orloj-backend-rust"
version = "0.1.0"
edition = "2024"
author = "Ehan Rouimi"

[dependencies]
alloy = { version = "2.0.4", features = ["consensus", "eips", "network", "json-abi", "dyn-abi", "providers", "transport-http", "reqwest", "rpc-types"] }
rmcp = { version = "0.16.0", features = ["server", "macros", "transport-io", "schemars"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-std", "net", "time"] }
anyhow = "1"
axum = "0.7"
axum-extra = { version = "0.9", features = ["typed-header"] }
tower-http = { version = "0.5", features = ["cors"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
dotenvy = "0.15"

[[bin]]
name = "orloj-backend-rust"
path = "src/main.rs"
